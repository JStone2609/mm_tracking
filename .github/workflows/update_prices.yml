# .github/workflows/update_prices.yml
name: Update Prices Cache

on:
  schedule:
    - cron: "10 22 * * 1-5"   # ~22:10 UTC on trading days (after US close)
  workflow_dispatch: {}
  push:
    paths:
      - "data/global/global_top_20.csv"
      - "data/global/global_ticker_map.csv"
      - ".github/workflows/update_prices.yml"
      - "scripts/update_yahoo_cache.py"
      - "mm_tracking/cache_builders.py"
      - "mm_tracking/core.py"

permissions:
  contents: write

concurrency:
  group: cache-updates-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Use the newer yfinance that worked locally for you
          pip install "yfinance==0.2.66" pandas numpy pyarrow

      - name: Generate prices cache
        run: |
          python scripts/update_yahoo_cache.py \
            --dataset data/global/global_top_20.csv \
            --map data/global/global_ticker_map.csv \
            --output caches/global_prices_cache.parquet \
            --mode buys \
            --competitor SPY \
            --competitor QQQ

      - name: Commit & push parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caches/global_prices_cache.parquet
          git commit -m "Update prices cache" || echo "No changes"
          git push
