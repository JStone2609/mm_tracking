name: Update Exodus Prices Cache

on:
  schedule:
    - cron: "20 22 * * 1-5"   # ~22:20 UTC on trading days (after US close)
  workflow_dispatch: {}
  push:
    paths:
      - "data/exodus/exodus_trades.csv"
      - "data/exodus/exodus_ticker_map.csv"
      - ".github/workflows/update_exodus_prices.yml"
      - "scripts/update_yahoo_cache.py"
      - "mm_tracking/cache_builders.py"
      - "mm_tracking/core.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.66" pandas numpy pyarrow

      - name: Generate exodus prices cache
        run: |
          python scripts/update_yahoo_cache.py \
            --dataset data/exodus/exodus_trades.csv \
            --map data/exodus/exodus_ticker_map.csv \
            --output caches/exodus_prices_cache.parquet \
            --mode trades \
            --competitor SPY \
            --competitor QQQ

      - name: Commit & push parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caches/exodus_prices_cache.parquet
          git commit -m "Update exodus prices cache" || echo "No changes"
          git pull --rebase origin main
          git push
