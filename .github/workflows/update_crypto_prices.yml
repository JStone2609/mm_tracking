# rerun all
name: Update Crypto Prices Cache

on:
  schedule:
    - cron: "20 22 * * *"   # daily ~22:20 UTC
  workflow_dispatch: {}
  push:
    paths:
      - "data/crypto/crypto_top_20.csv"
      - "data/crypto/crypto_map.csv"
      - ".github/workflows/update_crypto_prices.yml"
      - "scripts/update_crypto_cache.py"
      - "mm_tracking/cache_builders.py"
      - "mm_tracking/core.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow python-dateutil requests

      - name: Generate crypto prices cache (CoinGecko)
        run: |
          python scripts/update_crypto_cache.py \
            --dataset data/crypto/crypto_top_20.csv \
            --map data/crypto/crypto_map.csv \
            --output caches/crypto_prices_cache.parquet \
            --competitor-id bitcoin \
            --competitor-id ethereum

      - name: Commit & push parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caches/crypto_prices_cache.parquet
          git commit -m "Update crypto prices cache" || echo "No changes"
          git push
